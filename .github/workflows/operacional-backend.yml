name: Portal UMA - backend operacional

on:
  push:
    branches: [feat/base-operacional]
    paths: ["operacional/backend/**", ".github/workflows/operacional-backend.yml"]
  pull_request:
    paths: ["operacional/backend/**", ".github/workflows/operacional-backend.yml"]

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: portal_uma_test
          POSTGRES_USER: portal_dev
          POSTGRES_PASSWORD: ci_only_not_production
        ports:
          - 5432:5432
        options: >-
          --health-cmd 'pg_isready -U portal_dev -d portal_uma_test'
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://portal_dev:ci_only_not_production@127.0.0.1:5432/portal_uma_test
      APP_ENV: development
    defaults:
      run:
        working-directory: operacional/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply and verify PostgreSQL migrations
        run: alembic upgrade head
      - name: Test security, goals, API and data models
        run: python -m pytest -q
