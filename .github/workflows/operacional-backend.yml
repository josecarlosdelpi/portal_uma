name: Portal UMA - backend operacional

on:
  push:
    branches: [feat/base-operacional]
    paths: ["operacional/backend/**", ".github/workflows/operacional-backend.yml"]
  pull_request:
    paths: ["operacional/backend/**", ".github/workflows/operacional-backend.yml"]

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operacional/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test security policies and basic API
        run: python -m pytest -q
