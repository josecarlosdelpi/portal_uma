# Portal UMA — stack de producao para VPS Linux com Docker.
# Uso: docker compose -f deploy/docker-compose.vps.yml --env-file deploy/.env up -d
# Somente Caddy (80/443) e publico; backend e banco ficam na rede interna.

name: portal-uma

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?informe o dominio em deploy/.env}
    depends_on:
      frontend:
        condition: service_started
    networks: [web]

  frontend:
    build:
      context: ../operacional/frontend
    restart: unless-stopped
    # Sem porta publica: acessivel apenas dentro da rede.
    networks: [web]

  backend:
    build:
      context: ../operacional/backend
    restart: unless-stopped
    # NAO roda alembic no boot: migration e etapa explicita
    # (deploy/scripts/migrate.sh), nunca automatica no restart.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_ENV: production
      CORS_ORIGINS: https://${DOMAIN}
      ERP_SYNC_ENABLED: "${ERP_SYNC_ENABLED:-true}"
      ERP_SYNC_INTERVAL_SECONDS: "${ERP_SYNC_INTERVAL_SECONDS:-600}"
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: /run/secrets/uma-drive-sa.json
    volumes:
      # Segredo da conta de servico: arquivo local nunca versionado.
      - ${DRIVE_SA_FILE:-./secrets/uma-drive-sa.json}:/run/secrets/uma-drive-sa.json:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [web, internal]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Sem mapeamento de porta: so rede interna.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina em deploy/.env}
      POSTGRES_USER: ${POSTGRES_USER:?defina em deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina em deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 768M
    networks: [internal]

  pgbackups:
    # Dump diario para o volume 'backups' + retencao de 14 dias.
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-14}"
    volumes:
      - ./scripts/backup-cron.sh:/backup-cron.sh:ro
      - backups:/backups
    entrypoint: ["sh", "/backup-cron.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  migrate:
    # Servico one-shot: migration explicita e controlada do deploy.
    build:
      context: ../operacional/backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["migrate"]
    networks: [internal]

networks:
  web: {}
  internal: {}

volumes:
  pgdata:
  backups:
  caddy_data:
  caddy_config:
