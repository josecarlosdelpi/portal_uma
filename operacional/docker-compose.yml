services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portal_uma_dev
      POSTGRES_USER: portal_dev
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - uma_postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal_dev -d portal_uma_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://portal_dev:local_only_change_me@db:5432/portal_uma_dev
      APP_ENV: development
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  uma_postgres_dev:
