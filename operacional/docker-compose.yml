services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portal_uma_dev
      POSTGRES_USER: portal_dev
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - uma_postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal_dev -d portal_uma_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  uma_postgres_dev:
