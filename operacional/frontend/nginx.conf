# Cadeia de proxies confiaveis: Caddy (borda) -> Nginx -> FastAPI.
# O Caddy reescreve X-Real-IP com o IP real do cliente ({remote_host}),
# descartando qualquer valor forjado enviado pelo cliente.
# Sem proxy a montante (dev local), cai no $remote_addr da conexao.
map $http_x_real_ip $trusted_client_ip {
    default $remote_addr;
    ~.+     $http_x_real_ip;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $trusted_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
